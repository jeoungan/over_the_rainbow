<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>over the rainbow</title>
  </head>
  <body>
    <div id="game-root"></div>
    <script>
      (() => {
        const path = window.location.pathname.replace(/\\/g, '/').toLowerCase();
        const isLocalDevHost = ['localhost', '127.0.0.1', '::1', '[::1]'].includes(window.location.hostname);
        const isBuiltEntry = path.endsWith('/dist/index.html');

        if (isBuiltEntry) {
          return;
        }

        if (window.location.protocol === 'file:' || !isLocalDevHost) {
          window.location.replace(new URL('./dist/index.html', window.location.href).href);
          return;
        }

        const script = document.createElement('script');
        script.type = 'module';
        script.src = '/src/main.ts';
        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
